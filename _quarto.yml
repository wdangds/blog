project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - teaching/**/*.qmd
    - research/**/*.qmd
    - blog/**/*.qmd
  resources:
    - assets/**

website:
  title: "Wan Dang"
  site-url: https://wdangds.github.io/
  repo-url: https://github.com/wdangds/wdangds.github.io
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: teaching/index.qmd
        text: Teaching
      - href: research/index.qmd
        text: Research
      - href: blog/index.qmd
        text: Blog
  sidebar:
    - id: teaching
      style: docked
      search: true
      contents:
        - section: "Teaching"
          href: teaching/index.qmd
          contents:
            - section: "CDS 201: Introduction to Computational Social Science"
              href: teaching/cds-201/index.qmd
              contents:
                - teaching/cds-201/module-1.qmd
                - teaching/cds-201/module-2.qmd
                - teaching/cds-201/module-3.qmd
                - teaching/cds-201/module-4.qmd
                - teaching/cds-201/module-5.qmd
                - teaching/cds-201/module-6.qmd
                - teaching/cds-201/module-7.qmd
                - teaching/cds-201/module-8.qmd
                - teaching/cds-201/module-9.qmd
                - teaching/cds-201/module-10.qmd
            - section: "CDS 303: Scientific Data Mining"
              href: teaching/cds-303/index.qmd
              contents:
                - teaching/cds-303/chapter-1.qmd
                - teaching/cds-303/chapter-2.qmd
                - teaching/cds-303/chapter-3.qmd
                - teaching/cds-303/chapter-4.qmd
                - teaching/cds-303/chapter-5.qmd
                - teaching/cds-303/chapter-6.qmd
                - teaching/cds-303/chapter-7.qmd
                - teaching/cds-303/chapter-8.qmd
                - teaching/cds-303/chapter-9.qmd
                - teaching/cds-303/chapter-10.qmd
                - teaching/cds-303/chapter-11.qmd
                - teaching/cds-303/chapter-12.qmd
format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-icon: true
    smooth-scroll: true

execute:
  freeze: auto
